# tmux Configuration - BitBot
# Global configuration for all BitBot containers
# Location: /etc/tmux.conf

# Mouse support
set -g mouse on

# History
set -g history-limit 10000

# Status bar
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-style bg=black,fg=white

# Status left: BitBot branding
set -g status-left "#[fg=cyan]BitBot #[fg=white]│ #[fg=colour240]#{b:pane_current_path} "
set -g status-left-length 50

# Status right: Scroll indicator (green dot = live, yellow arrow = scrolled)
set -g status-right " #{?pane_in_mode,#[fg=yellow]▼,#[fg=green]●}"
set -g status-right-length 3

# Terminal
set -g default-terminal "screen-256color"

# Note: Users can override with ~/.tmux.conf mounted from global config
