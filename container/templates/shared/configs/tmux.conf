# tmux Configuration - BitBot
# Global configuration for all BitBot containers
# Location: /etc/tmux.conf

# Mouse support
set -g mouse on

# History
set -g history-limit 10000

# Status bar (off by default for clean AI assistant UI)
set -g status off

# Terminal
set -g default-terminal "screen-256color"

# Note: Users can override with ~/.tmux.conf
# Example: echo 'set -g status on' > ~/.tmux.conf && tmux source-file ~/.tmux.conf
