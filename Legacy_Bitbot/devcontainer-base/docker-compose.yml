networks:
  mcp-network:
    external: true
    name: mcp-services_mcp-network
  workspace-mcp-network:
    external: true
    name: devcontainer-base_workspace-mcp-network

services:
  dotnet-dev:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        TZ: "${TZ:-UTC}"
        CLAUDE_CODE_VERSION: "${CLAUDE_CODE_VERSION:-latest}"
        GIT_DELTA_VERSION: "${GIT_DELTA_VERSION:-0.18.2}"
        ZSH_IN_DOCKER_VERSION: "${ZSH_IN_DOCKER_VERSION:-1.2.0}"
    container_name: "bitbot-dev-${WORKSPACE_HASH:-default}"
    networks:
      - mcp-network
      - workspace-mcp-network
    volumes:
      - type: bind
        source: "${WORKSPACE_FOLDER:-.}"
        target: /workspace
      - type: volume
        source: claude-code-bashhistory
        target: /commandhistory
      - type: bind
        source: "../config"
        target: /home/node/.claude
      - type: bind
        source: "./scripts"
        target: /home/node/scripts
        read_only: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - POWERLEVEL9K_DISABLE_GITSTATUS=true
      - DEVCONTAINER=true
      - MCP_REGISTRY_URL=http://mcp-registry:8080
      - MCP_GATEWAY_URL=http://mcp-gateway:8090
      - WORKSPACE_MCP_REGISTRY_URL=http://localhost:9080
      - WORKSPACE_MCP_GATEWAY_URL=http://localhost:9090
      - WORKSPACE_HASH=${WORKSPACE_HASH:-default}
      - TZ=${TZ:-UTC}
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  claude-code-bashhistory:
    driver: local