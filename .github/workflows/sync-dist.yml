name: Sync Release Branch

on:
  push:
    branches:
      - trunk
    paths:
      - 'bitbot.exe'
      - 'bitbot'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to release branch
        run: |
          echo "Syncing trunk to release branch..."

          # Check if release branch exists
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            echo "Checking out existing release branch..."
            git checkout release
          else
            echo "Creating new orphan release branch..."
            git checkout --orphan release
            git rm -rf . || true
          fi

          # Remove all files except .git
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} \; || true

          # Copy release files from trunk
          echo "Copying release files..."
          git checkout trunk -- bitbot.exe bitbot README.md LICENSE 2>/dev/null || echo "Some files may not exist yet"

          # Create release-specific .gitignore
          cat > .gitignore << 'EOF'
          # Release branch - exclude dev files
          _SPARC/
          tests/
          .devcontainer/
          src/
          scripts/
          .github/
          .vscode/
          *.log
          CLAUDE.md
          EOF

          # Add all files
          git add .

          # Commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            TRUNK_COMMIT=$(git rev-parse --short trunk)
            git commit -m "Sync from trunk @ $TRUNK_COMMIT"
            git push origin release
            echo "Release branch updated successfully"
          fi

      - name: Summary
        run: |
          echo "✓ Sync complete"
          echo "Users can access clean release:"
          echo "  git clone -b release ${{ github.server_url }}/${{ github.repository }}.git"
