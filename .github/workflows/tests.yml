name: Tests

on:
  push:
    branches:
      - trunk
    paths:
      - 'core/**'
      - 'dev/tests/**'
      - 'container/bitbot/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - trunk

jobs:
  # Fast syntax and shellcheck analysis
  shellcheck:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check bash scripts syntax
        run: |
          echo "Checking bash script syntax..."
          find core -name "*.sh" -type f -exec bash -n {} \;
          find dev/scripts -name "*.sh" -type f -exec bash -n {} \;
          find dev/tests -name "*.sh" -type f -exec bash -n {} \;
          find container/bitbot -name "*.sh" -type f -exec bash -n {} \;
          find container/templates -name "*.sh" -type f -exec bash -n {} \;
          bash -n core/bitbot
          echo "✓ All bash scripts have valid syntax"

      - name: Run shellcheck
        run: |
          cd dev/tests
          chmod +x test-shellcheck.sh
          ./test-shellcheck.sh

  # Main test suite
  test-ubuntu:
    name: Tests (Ubuntu)
    needs: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install DevContainer CLI
        run: npm install -g @devcontainers/cli

      - name: Set execute permissions on scripts
        run: |
          chmod +x dev/tests/*.sh
          chmod +x dev/tests/helpers/*.sh 2>/dev/null || true
          chmod +x container/bitbot/bitbot
          chmod +x container/bitbot/core/commands/*.sh
          chmod +x container/bitbot/core/util/*.sh

      - name: Run helper function tests
        run: |
          cd dev/tests
          ./test-helpers.sh

      - name: Run BitBot command tests
        run: |
          cd dev/tests
          chmod +x test-bitbot-commands.sh
          ./test-bitbot-commands.sh

      - name: Run platform detection tests
        run: |
          cd dev/tests
          chmod +x test-platform-detection.sh
          ./test-platform-detection.sh

      - name: Run prerequisite tests
        run: |
          cd dev/tests
          ./test-prerequisites.sh || true
          echo "Prerequisite tests completed"

      - name: Run workspace init tests
        run: |
          cd dev/tests
          ./test-workspace-init.sh

      - name: Run container BitBot tests
        run: |
          cd dev/tests
          chmod +x test-container-bitbot.sh
          ./test-container-bitbot.sh

      - name: Run integration tests
        run: |
          cd dev/tests
          ./run-tests.sh --quick

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            /tmp/shellcheck-*.log
            dev/tests/*.log
          if-no-files-found: ignore

  # Security validation
  security-check:
    name: Security Validation
    needs: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run security tests
        run: |
          cd dev/tests
          chmod +x test-helpers.sh
          echo "Running security injection tests..."
          ./test-helpers.sh
          echo "✓ All security tests passed"

  # Optional: Windows basic tests (script validation only)
  test-windows:
    name: Tests (Windows - Basic)
    runs-on: windows-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test core/bitbot launcher
        shell: cmd
        run: |
          echo Testing core/bitbot launcher...
          if not exist core\bitbot (
            echo ERROR: core/bitbot not found
            exit /b 1
          )
          if not exist core\bitbot.cmd (
            echo ERROR: core/bitbot.cmd not found
            exit /b 1
          )
          echo ✓ core/bitbot launchers exist

      - name: Test PowerShell scripts
        shell: pwsh
        run: |
          Write-Host "Checking for .ps1 files..."
          $scripts = Get-ChildItem -Path . -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue
          if ($scripts) {
            Write-Host "Found PowerShell scripts, checking syntax..."
            foreach ($script in $scripts) {
              $null = [System.Management.Automation.PSParser]::Tokenize(
                (Get-Content $script.FullName -Raw), [ref]$null
              )
            }
            Write-Host "✓ All PowerShell scripts have valid syntax"
          } else {
            Write-Host "No PowerShell scripts found"
          }
