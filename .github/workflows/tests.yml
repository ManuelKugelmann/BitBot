name: Tests

on:
  push:
    branches:
      - trunk
    paths:
      - 'core/**'
      - 'dev/tests/**'
      - 'container/bitbot/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - trunk

jobs:
  # Fast syntax and shellcheck analysis
  shellcheck:
    name: ShellCheck & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check bash scripts syntax
        run: |
          echo "Checking bash script syntax..."
          find core -name "*.sh" -type f -exec bash -n {} \;
          find dev/scripts -name "*.sh" -type f -exec bash -n {} \;
          find dev/tests -name "*.sh" -type f -exec bash -n {} \;
          find container/bitbot -name "*.sh" -type f -exec bash -n {} \;
          find container/templates -name "*.sh" -type f -exec bash -n {} \;
          bash -n core/bitbot
          echo "✓ All bash scripts have valid syntax"

      - name: Run shellcheck
        run: |
          cd dev/tests
          chmod +x test-shellcheck.sh
          ./test-shellcheck.sh

  # Main test suite
  test-ubuntu:
    name: Tests (Ubuntu)
    needs: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install DevContainer CLI
        run: npm install -g @devcontainers/cli

      - name: Set execute permissions on scripts
        run: |
          chmod +x dev/tests/*.sh
          chmod +x dev/tests/helpers/*.sh 2>/dev/null || true
          chmod +x container/bitbot/bitbot
          chmod +x container/bitbot/core/commands/*.sh
          chmod +x container/bitbot/core/util/*.sh

      - name: Run helper function tests
        run: |
          cd dev/tests
          ./test-helpers.sh

      - name: Run BitBot command tests
        run: |
          cd dev/tests
          chmod +x test-bitbot-commands.sh
          ./test-bitbot-commands.sh

      - name: Run platform detection tests
        run: |
          cd dev/tests
          chmod +x test-platform-detection.sh
          ./test-platform-detection.sh

      - name: Run prerequisite tests
        run: |
          cd dev/tests
          ./test-prerequisites.sh || true
          echo "Prerequisite tests completed"

      - name: Run workspace init tests
        run: |
          cd dev/tests
          ./test-workspace-init.sh

      - name: Run container BitBot tests
        run: |
          cd dev/tests
          chmod +x test-container-bitbot.sh
          ./test-container-bitbot.sh

      - name: Run integration tests
        run: |
          cd dev/tests
          ./run-tests.sh --quick

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            /tmp/shellcheck-*.log
            dev/tests/*.log
          if-no-files-found: ignore

  # Security validation
  security-check:
    name: Security Validation
    needs: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run security tests
        run: |
          cd dev/tests
          chmod +x test-helpers.sh
          echo "Running security injection tests..."
          ./test-helpers.sh
          echo "✓ All security tests passed"

  # Container build and validation tests
  test-containers:
    name: Container Build & Start Tests
    needs: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install DevContainer CLI
        run: npm install -g @devcontainers/cli

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test workspace
        run: |
          mkdir -p /tmp/bitbot-test-workspace
          cd /tmp/bitbot-test-workspace
          git init

      - name: Initialize BitBot in test workspace
        run: |
          cd /tmp/bitbot-test-workspace
          export BITBOT_HOME="${GITHUB_WORKSPACE}"
          # Non-interactive init - copy .devcontainer directly
          mkdir -p .devcontainer
          cp "${GITHUB_WORKSPACE}/container/templates/bitbot-base/Dockerfile" .devcontainer/

          # Create minimal devcontainer.json for testing
          cat > .devcontainer/devcontainer.json <<'EOF'
          {
            "name": "BitBot Test Container",
            "dockerFile": "Dockerfile",
            "workspaceFolder": "/workspace",
            "features": {
              "ghcr.io/devcontainers/features/node:1": {
                "version": "lts"
              }
            },
            "remoteUser": "root",
            "mounts": [
              "source=${localWorkspaceFolder},target=/workspace,type=bind,consistency=cached"
            ],
            "runArgs": [
              "--cpus=4",
              "--memory=8g",
              "--memory-swap=8g",
              "--pids-limit=2048"
            ]
          }
          EOF

          # Copy BitBot container scripts
          mkdir -p .devcontainer/bitbot
          cp -r "${GITHUB_WORKSPACE}/container/bitbot/"* .devcontainer/bitbot/
          echo "✓ Test workspace initialized"

      - name: Build and start bitbot-base container
        run: |
          cd /tmp/bitbot-test-workspace
          echo "Building and starting bitbot-base container..."
          devcontainer up --workspace-folder .
          echo "✓ bitbot-base container built and started successfully"

      - name: Test container environment
        run: |
          cd /tmp/bitbot-test-workspace
          echo "Running container tests..."
          devcontainer exec --workspace-folder . bash -c '
            echo "Testing container environment..."

            # Test 1: Check if bash is available
            if command -v bash &>/dev/null; then
              echo "✓ bash available"
            else
              echo "✗ bash not available"
              exit 1
            fi

            # Test 2: Check if jq is available
            if command -v jq &>/dev/null; then
              echo "✓ jq available"
            else
              echo "✗ jq not available"
              exit 1
            fi

            # Test 3: Check workspace mount
            if [ -d "/workspace" ]; then
              echo "✓ workspace mounted"
            else
              echo "✗ workspace not mounted"
              exit 1
            fi

            # Test 4: Check BitBot scripts exist
            if [ -f "/workspace/.devcontainer/bitbot/bitbot" ]; then
              echo "✓ container BitBot scripts available"
            else
              echo "✗ container BitBot scripts not found"
              exit 1
            fi

            # Test 5: Run container BitBot help
            if bash /workspace/.devcontainer/bitbot/bitbot help &>/dev/null; then
              echo "✓ container BitBot help works"
            else
              echo "✗ container BitBot help failed"
              exit 1
            fi

            echo ""
            echo "All container tests passed!"
          '

      - name: Test container resource limits
        run: |
          cd /tmp/bitbot-test-workspace
          echo "Checking container resource limits..."
          devcontainer exec --workspace-folder . bash -c '
            # Check CPU limit (cgroup v1 and v2)
            if [ -f "/sys/fs/cgroup/cpu.max" ]; then
              # cgroup v2
              cpu_max=$(cat /sys/fs/cgroup/cpu.max)
              echo "CPU limit (cgroup v2): ${cpu_max}"
            elif [ -f "/sys/fs/cgroup/cpu/cpu.cfs_quota_us" ]; then
              # cgroup v1
              quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
              period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
              if [ "$quota" != "-1" ]; then
                cpus=$((quota / period))
                echo "CPU limit (cgroup v1): ${cpus} cores"
              fi
            else
              echo "CPU limit: not detected (cgroup v1/v2)"
            fi

            # Check memory limit (cgroup v1 and v2)
            if [ -f "/sys/fs/cgroup/memory.max" ]; then
              # cgroup v2
              mem_max=$(cat /sys/fs/cgroup/memory.max)
              if [ "$mem_max" != "max" ]; then
                mem_gb=$((mem_max / 1024 / 1024 / 1024))
                echo "Memory limit (cgroup v2): ${mem_gb}GB"
              fi
            elif [ -f "/sys/fs/cgroup/memory/memory.limit_in_bytes" ]; then
              # cgroup v1
              mem_bytes=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
              mem_gb=$((mem_bytes / 1024 / 1024 / 1024))
              echo "Memory limit (cgroup v1): ${mem_gb}GB"
            else
              echo "Memory limit: not detected (cgroup v1/v2)"
            fi

            echo "✓ Resource limits configuration verified"
          '

      - name: Cleanup test workspace
        if: always()
        run: |
          rm -rf /tmp/bitbot-test-workspace

  # Optional: Windows basic tests (script validation only)
  test-windows:
    name: Tests (Windows - Basic)
    runs-on: windows-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test core/bitbot launcher
        shell: cmd
        run: |
          echo Testing core/bitbot launcher...
          if not exist core\bitbot (
            echo ERROR: core/bitbot not found
            exit /b 1
          )
          if not exist core\bitbot.cmd (
            echo ERROR: core/bitbot.cmd not found
            exit /b 1
          )
          echo ✓ core/bitbot launchers exist

      - name: Test PowerShell scripts
        shell: pwsh
        run: |
          Write-Host "Checking for .ps1 files..."
          $scripts = Get-ChildItem -Path . -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue
          if ($scripts) {
            Write-Host "Found PowerShell scripts, checking syntax..."
            foreach ($script in $scripts) {
              $null = [System.Management.Automation.PSParser]::Tokenize(
                (Get-Content $script.FullName -Raw), [ref]$null
              )
            }
            Write-Host "✓ All PowerShell scripts have valid syntax"
          } else {
            Write-Host "No PowerShell scripts found"
          }
