networks:
  mcp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  mcp-registry:
    build: 
      context: ../shared/registry
      dockerfile: Dockerfile
      args:
        TZ: "${TZ:-UTC}"
    container_name: mcp-registry
    ports:
      - "8080:8080"
    networks:
      mcp-network:
        ipv4_address: 172.20.0.10
    environment:
      - REGISTRY_PORT=8080
      - MCP_NETWORK=mcp-network
      - TZ=${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  simple-mcp:
    build:
      context: ../shared/simple-mcp
      dockerfile: Dockerfile
      args:
        TZ: "${TZ:-UTC}"
    container_name: simple-mcp
    networks:
      mcp-network:
        ipv4_address: 172.20.0.20
    environment:
      - MCP_SERVER_NAME=simple-mcp
      - MCP_SERVER_VERSION=1.0.0
      - REGISTRY_URL=http://mcp-registry:8080
      - TZ=${TZ:-UTC}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - mcp-registry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-gateway:
    image: alpine/socat:latest
    container_name: mcp-gateway
    networks:
      mcp-network:
        ipv4_address: 172.20.0.5
    ports:
      - "8090:8090"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    command: ["TCP-LISTEN:8090,fork,reuseaddr", "TCP:simple-mcp:3000"]
    depends_on:
      - simple-mcp
    restart: unless-stopped

volumes:
  mcp-data:
    driver: local