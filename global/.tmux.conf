# tmux Configuration - Global User Settings
# Shared across all workspaces (read-only mount)
# Location: ~/.tmux.conf (mounted from BitBot/global/.tmux.conf)

# Mouse support
set -g mouse on

# History
set -g history-limit 10000

# Status bar (off by default for clean AI assistant UI)
set -g status off

# Terminal
set -g default-terminal "screen-256color"

# Note: This file is mounted read-only in BitBot containers
# To customize, edit BitBot/global/.tmux.conf directly
# Or create workspace-specific overrides in /workspace/.tmux.conf
