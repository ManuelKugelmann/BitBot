# tmux Configuration - Global User Settings
# Shared across all workspaces (read-only mount)
# Location: ~/.tmux.conf (mounted from BitBot/global/.tmux.conf)

# Mouse support (scroll + right-click paste)
set -g mouse on
bind-key -n MouseDown3Pane paste-buffer

# History
set -g history-limit 10000

# Status bar
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-style bg=black,fg=white

# Status left: BitBot branding + host workspace path
set -g status-left "#[fg=cyan]BitBot #[fg=yellow]$BITBOT_PROJECT_PATH #[fg=white]│ #[fg=colour240]#{b:pane_current_path} "
set -g status-left-length 80

# Status right: Scroll indicator (green dot = live, yellow arrow = scrolled)
set -g status-right " #{?pane_in_mode,#[fg=yellow]▼,#[fg=green]●}"
set -g status-right-length 3

# Terminal
set -g default-terminal "screen-256color"

# Note: This file is mounted read-only in BitBot containers
# Mouse features enabled:
#   - Scroll wheel: Navigate history
#   - Drag selection: Select and copy text
#   - Double-click: Select word
#   - Triple-click: Select line
#   - Right-click: Terminal context menu (passthrough enabled)
# To customize, edit BitBot/global/.tmux.conf directly
# Or create workspace-specific overrides in /workspace/.tmux.conf
